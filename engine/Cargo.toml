[package]
name = "voxbox"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "VoxBox: builds real-world places as small voxels from open map and elevation data"

[lib]
name = "voxbox"
path = "src/lib.rs"

[[bin]]
name = "voxbox"
path = "src/main.rs"

[dependencies]
osmpbf = "0.3"
tiff = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = 1

[profile.dev]
opt-level = 2
